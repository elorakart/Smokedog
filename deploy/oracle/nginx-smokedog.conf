# Optional: nginx reverse proxy + TLS (run after DNS points game.yourdomain.com to VM IP)
# sudo apt install nginx certbot python3-certbot-nginx
# sudo cp deploy/oracle/nginx-smokedog.conf /etc/nginx/sites-available/smokedog-game
# sudo ln -sf /etc/nginx/sites-available/smokedog-game /etc/nginx/sites-enabled/
# Edit server_name, then: sudo certbot --nginx -d game.yourdomain.com

server {
    listen 80;
    server_name game.example.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
